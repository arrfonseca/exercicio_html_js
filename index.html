<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML com JS</title>
    <link rel="stylesheet" href="./main.css" />
</head>
<body>
    <div class="container">
        <h1>Exercício Compara Campo</h1>
            <form id="form-compara">
            <h3>Campo A </h3><input type="number" id="campoNumero1" required placeholder="Digite um número qualquer" />
            <h3>Campo B </h3><input type="number" id="campoNumero2" required placeholder="Digite um número maior que o anterior" />
            <button id="btn-compara" type="submit">Comparar</button>
        </form>
        <p class="deu-bom"> Deu bom! O número do campo B é MAIOR que o do campo A</p>
        <p class="deu-ruim">Deu ruim! O númerodo campo B é MENOR que o do campo A</p>
    </div>
    <script src="./main.js"></script>
</body>
</html>
